spring.application.name=tennis-club-manager
server.port=8086

# In-memory H2. Hibernate builds the schema on every start and DataInitializer
# fills it with invented demo data, so the app always opens on the same populated
# state. Anything you change in the UI lasts until the next restart.
spring.datasource.url=jdbc:h2:mem:tennisdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# http://localhost:8086/h2-console  (JDBC URL: jdbc:h2:mem:tennisdb, user sa, no password)
spring.h2.console.enabled=true

# Outgoing club emails are not sent anywhere. EmailServiceImpl writes each one as an
# .html file into this folder and logs a line to the console. Nothing leaves the machine.
app.outbox.dir=./outbox
