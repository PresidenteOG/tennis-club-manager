<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido - Almendral TC</title>
    <script src="/vendor/tailwind.js"></script>
    <link href="/vendor/fonts/montserrat.css" rel="stylesheet">
    <style>
        :root {
            --bg-page: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            --atc-rojo: #ef4444;
            --atc-gris-borde: #475569;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.03);
            border: 4px solid var(--atc-gris-borde);
            border-radius: 50px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8);
            max-width: 600px;
            position: relative;
        }

        .errorCode {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 0%, #475569 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .alert-tag {
            background: var(--atc-rojo);
            color: white;
            padding: 5px 20px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            display: inline-block;
            margin-bottom: 30px;
        }

        .message {
            font-size: 14px;
            font-weight: 400;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: white;
            color: black;
            padding: 15px 40px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
            transition: 0.3s;
            border: 2px solid white;
        }

        .btn-back:hover {
            background: transparent;
            color: white;
        }

        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="bg-overlay"></div>

    <main class="error-container">
        <div class="alert-tag">Security Breach</div>
        <h1 class="errorCode">403</h1>
        
        <div class="flex justify-center mb-8">
            <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                <rect x="5" y="7" width="14" height="12" rx="2" stroke-width="2" />
            </svg>
        </div>

        <p class="message">
            Tus credenciales actuales no tienen los privilegios necesarios<br>
            para ejecutar operaciones en este sector del sistema.
        </p>

        <a href="/menu_principal" class="btn-back">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
            </svg>
            Regresar a Zona Segura
        </a>

        <div class="mt-12 opacity-20 text-[8px] uppercase tracking-[10px]">
            Almendral TC 2026
        </div>
    </main>
</body>
</html>
