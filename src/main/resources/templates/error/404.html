<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Sistema No Encontrado</title>
    <script src="/vendor/tailwind.js"></script>
    <link href="/vendor/fonts/montserrat.css" rel="stylesheet">
    <style>
        :root {
            --bg-page: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            --atc-warning: #f59e0b; /* Amarillo Industrial */
            --atc-gris-borde: #475569;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-page);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            margin: 0;
        }

        .error-container {
            text-align: center;
            padding: 60px;
            background: rgba(255, 255, 255, 0.02);
            border: 4px solid var(--atc-gris-borde);
            border-radius: 50px;
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.9);
            max-width: 650px;
            position: relative;
        }

        .errorCode {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 0%, #64748b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-tag {
            background: var(--atc-warning);
            color: black;
            padding: 5px 20px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .message {
            font-size: 14px;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 30px 0 40px 0;
            line-height: 1.6;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: transparent;
            color: white;
            padding: 15px 40px;
            border-radius: 20px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
            transition: 0.3s;
            border: 2px solid var(--atc-gris-borde);
        }

        .btn-back:hover {
            background: white;
            color: black;
            border-color: white;
        }

        .blueprint-lines {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: -1;
        }
    </style>
</head>
<body>
    <div class="blueprint-lines"></div>

    <main class="error-container">
        <div class="status-tag">Ruta Desconocida</div>
        <h1 class="errorCode">404</h1>
        
        <div class="flex justify-center my-8">
            <svg class="w-20 h-20 text-amber-500 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
            </svg>
        </div>

        <p class="message">
            El recurso o componente solicitado no ha sido localizado<br>
            en el servidor. Verifique la dirección URL o el enlace técnico.
        </p>

        <a href="/menu_principal" class="btn-back">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M3 12h18M3 12l6-6m-6 6l6 6" />
            </svg>
            Reconectar con Sistema
        </a>

        <div class="mt-12 flex justify-center gap-8 opacity-20 text-[7px] uppercase tracking-[5px]">
            <span>Log_ID: <span th:text="${#dates.format(#dates.createNow(), 'yyyyMMdd-HHmm')}">20260104</span></span>
            <span>CTT_CORE_V2</span>
        </div>
    </main>
</body>
</html>
