<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Panel de Administración - Eventos</title>
    <link href="/vendor/fonts/montserrat.css" rel="stylesheet">
    <script src="/vendor/tailwind.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
    <style>
        :root { --bg-grad-1: #1f2937; --bg-grad-2: #0f172a; --card-bg: #1e293b; --card-bg-hover: #0f172a; --border-color: #334155; --border-highlight: #475569; --text-main: #f1f5f9; --text-muted: #94a3b8; --btn-bg: #334155; --btn-hover: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; background: radial-gradient(circle at center, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%); display: flex; min-height: 100vh; overflow-y: scroll; color: var(--text-main); transition: background 0.5s ease;}
        
        /* ADAPTACIÓN DINÁMICA SEGÚN ROL */
        body.admin-layout .main-content { margin-left: 280px; width: calc(100% - 280px); }
        body.player-layout .main-content { margin-left: 0; width: 100%; }
        .main-content { flex: 1; padding: 40px; position: relative; }

        .admin-layout-grid { display: grid; grid-template-columns: 350px 1fr; gap: 30px; max-width: 1400px; margin: 0 auto; }
        
        /* FORMULARIO DE RESERVA */
        .form-card { background: var(--card-bg); padding: 30px; border-radius: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); height: fit-content; border: 4px solid var(--border-color); transition: 0.3s;}
        .form-card h2 { color: var(--text-main); text-transform: uppercase; margin-bottom: 20px; font-weight: 900; font-size: 1.2em; border-bottom: 3px solid var(--border-highlight); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 800; color: var(--text-muted); margin-bottom: 5px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px;}
        
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; 
            padding: 12px; 
            background: var(--card-bg-hover); 
            border: 2px solid var(--border-color); 
            border-radius: 12px; 
            color: var(--text-main); 
            font-weight: 600; 
            outline: none; 
            transition: 0.3s;
            color-scheme: dark; 
        }
        .form-group input:focus, .form-group select:focus { border-color: var(--border-highlight); }
        
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1) brightness(0.8); cursor: pointer; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover,
        input[type="time"]::-webkit-calendar-picker-indicator:hover { background-color: transparent; filter: invert(1) brightness(1); }

        select option { background: var(--card-bg-hover); color: var(--text-main); font-weight: 600; }

        .btn-save { width: 100%; background: var(--btn-bg); color: var(--text-main); border: 2px solid var(--border-color); padding: 15px; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
        .btn-save:hover { background: var(--border-highlight); border-color: var(--border-highlight); transform: translateY(-2px);}

        .btn-cancel { width: 100%; background: transparent; color: var(--text-muted); border: 2px solid var(--border-color); padding: 12px; border-radius: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-top: 10px;}
        .btn-cancel:hover { background: var(--card-bg-hover); color: var(--text-main); border-color: var(--text-muted); }

        /* CALENDARIO */
        .calendar-container { background: var(--card-bg); border-radius: 40px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.4); border: 4px solid var(--border-color); transition: 0.3s;}
        .calendar-header { padding: 30px 40px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg-hover); border-bottom: 2px solid var(--border-color);}
        .month-year { font-size: 1.5em; font-weight: 900; color: var(--text-main); text-transform: uppercase; }
        
        .nav-buttons { display: flex; gap: 10px; align-items: center; }
        .nav-btn { background: var(--card-bg); border: 2px solid var(--border-color); width: 40px; height: 40px; border-radius: 12px; font-size: 1.2em; cursor: pointer; color: var(--text-muted); font-weight: 700; transition: 0.3s; }
        .nav-btn:hover { background: var(--border-highlight); color: var(--text-main); transform: translateY(-2px); }
        
        .today-btn { background-color: var(--btn-bg); border: 2px solid var(--border-color); color: var(--text-main); padding: 8px 15px; border-radius: 12px; font-weight: 700; font-size: 0.8rem; text-transform: uppercase; cursor: pointer; transition: 0.3s; margin-left: 10px; width: auto; height: 40px; }
        .today-btn:hover { background-color: var(--border-highlight); border-color: var(--border-highlight); transform: translateY(-2px); }
        
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; padding: 20px 40px 40px 40px; }
        .day-header { text-align: center; font-weight: 800; color: var(--text-muted); text-transform: uppercase; font-size: 0.7em; padding: 10px 0; letter-spacing: 1px;}
        .day-cell { min-height: 100px; border: 2px solid var(--border-color); background: var(--card-bg-hover); border-radius: 15px; padding: 10px; transition: 0.3s; cursor: pointer; position: relative;}
        .day-cell:hover { border-color: var(--border-highlight); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .day-number { font-weight: 800; color: var(--text-main); margin-bottom: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;}
        
        .day-cell.today { border: 2px solid var(--border-highlight); background: var(--card-bg); }
        .day-cell.today .day-number { background-color: var(--border-highlight); color: var(--text-main); border-radius: 50%; }
        .day-cell.other-month { opacity: 0.3; }
        
        .event { background: var(--bg-grad-1); color: var(--text-main); padding: 6px 8px; border-radius: 8px; font-size: 0.7em; margin-top: 5px; border-left: 3px solid var(--border-highlight); pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700;}
        .event-count { background: var(--border-color); color: var(--text-muted); padding: 4px; border-radius: 12px; font-size: 0.7em; margin-top: 5px; text-align: center; font-weight: 800; pointer-events: none; }
        
        /* Modal Eventos Diarios */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px); transition: opacity 0.3s;}
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border: 4px solid var(--border-color); padding: 40px; border-radius: 30px; max-width: 600px; width: 90%; position: relative; max-height: 90vh; overflow-y: auto;}
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; }
        .modal-title { color: var(--text-main); font-size: 1.5em; font-weight: 900; text-transform: uppercase;}
        .close-btn { background: none; border: none; font-size: 32px; cursor: pointer; color: var(--text-muted); transition: 0.3s; }
        .close-btn:hover { color: #ef4444; transform: scale(1.1); }
        
        .event-detail-box { border-left: 6px solid var(--border-highlight); background: var(--card-bg-hover); border-radius: 20px; padding: 25px; margin-bottom: 15px; border-right: 2px solid var(--border-color); border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); }
        .event-detail-box h3 { color: var(--border-highlight); margin-top: 0; margin-bottom: 15px; font-size: 1.1em; font-weight: 900; text-transform: uppercase;}
        .event-detail-box p { margin: 8px 0; color: var(--text-main); line-height: 1.4; font-weight: 600; font-size: 0.85rem;}

        .theme-card { background: var(--card-bg); border-color: var(--border-color); transition: all 0.3s ease; }
        .theme-text { color: var(--text-main); }

        /* Selector de Temas */
        .theme-switcher-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 3px solid var(--border-highlight); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 9999; transition: 0.3s; }
        .theme-switcher-btn:hover { transform: rotate(45deg) scale(1.1); }
        .theme-panel { position: fixed; bottom: 100px; right: 30px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; padding: 20px; width: 250px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 9998; display: none; opacity: 0; transition: 0.3s; }
        .theme-panel.active { display: block; opacity: 1; }
        .theme-option { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-weight: bold; text-align: left; display: flex; align-items: center; gap: 10px; transition: 0.2s; color: white; }

        @media (max-width: 1200px) { .admin-layout-grid { grid-template-columns: 1fr; } }
        @media (max-width: 768px) { body.admin-layout .main-content { margin-left: 70px; width: calc(100% - 70px); padding: 20px;} .calendar { padding: 10px;} .day-cell { min-height: 80px;} }
    </style>
</head>
<body th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'admin-layout' : 'player-layout'">

    <div sec:authorize="hasAuthority('ROLE_ADMIN')" th:replace="fragments/sidebar :: sidebar"></div>
    
    <div class="main-content">
        <div style="margin-bottom: 20px; width: 100%; max-width: 1400px; margin: 0 auto;">
            <a th:href="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? '/menu_admin' : '/menu_normal'" 
               class="text-xs font-bold uppercase tracking-widest transition inline-flex items-center gap-2" style="color: var(--text-muted);">
                <i class="fas fa-arrow-left"></i> Volver a mi menú
            </a>
        </div>

        <header class="py-6 text-center w-full relative">
            <h1 class="theme-card inline-block px-12 py-4 rounded-full border-4 text-3xl font-black uppercase tracking-widest shadow-2xl theme-text mb-6">
                <i class="far fa-calendar-alt mr-2" style="color: var(--border-highlight);"></i> Calendario
            </h1>
        </header>

        <div th:if="${error}" class="max-w-[1400px] mx-auto bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-xl mb-6 font-black uppercase text-xs tracking-widest shadow-lg text-center" th:text="${error}"></div>
        <div th:if="${success}" class="max-w-[1400px] mx-auto bg-emerald-900/50 border border-emerald-500 text-emerald-200 p-4 rounded-xl mb-6 font-black uppercase text-xs tracking-widest shadow-lg text-center" th:text="${success}"></div>

        <div class="admin-layout-grid mt-2">
            <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="form-card">
                <h2 id="formTitulo"><i class="fas fa-plus-circle mr-2"></i>Nueva Actividad</h2>
                
                <form th:action="@{/menu_admin/calendario/guardar}" th:object="${nuevoEvento}" method="post">
                    <input type="hidden" th:field="*{id}" id="eventoId" name="id">

                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" th:field="*{title}" id="title" placeholder="Ej: Entrenamiento Senior" required>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" th:field="*{date}" id="date" required>
                    </div>
                    <div class="form-group">
                        <label>Hora</label>
                        <input type="time" th:field="*{time}" id="time" required>
                    </div>
                    <div class="form-group">
                        <label>Pista</label>
                        <select th:field="*{pista.id}" id="pista" required>
                            <option value="">Seleccionar pista...</option>
                            <option th:each="p : ${pistas}" th:value="${p.id}" th:text="${p.nombrePista}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Descripción</label>
                        <textarea th:field="*{description}" id="description" rows="3" placeholder="Detalles de la reserva..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn-save" id="btnSubmitForm">Publicar Reserva</button>
                    <button type="button" onclick="cancelarEdicion()" id="btnCancelEdit" class="btn-cancel hidden">Cancelar Edición</button>
                </form>
            </div>

            <div class="calendar-container" th:style="${!#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'grid-column: 1 / -1;' : ''">
                <div class="calendar-header">
                    <div class="month-year" id="monthYear"></div>
                    <div class="nav-buttons">
                        <button class="nav-btn" onclick="previousMonth()"><i class="fas fa-chevron-left"></i></button>
                        <button class="nav-btn" onclick="nextMonth()"><i class="fas fa-chevron-right"></i></button>
                        <button class="today-btn" onclick="goToToday()">Hoy</button>
                    </div>
                </div>
                <div class="calendar" id="calendarGrid"></div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="eventModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalDateTitle">Reservas del Día</h2>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="eventDetails"></div>
        </div>
    </div>

    <div class="modal" id="deleteModal" style="z-index: 10000;">
        <div class="rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-100 transition-transform" style="background: var(--card-bg); border: 4px solid var(--border-color);">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-900/30 rounded-full flex items-center justify-center mb-6">
                    <i class="fas fa-exclamation-triangle text-4xl text-red-500"></i>
                </div>
                <h3 class="text-2xl font-black uppercase mb-3" style="color: var(--text-main);">¿Estás seguro?</h3>
                <p class="font-medium mb-8 text-sm" style="color: var(--text-muted);">Esta reserva será eliminada permanentemente del sistema.</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="cerrarDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase text-xs transition" style="background: var(--card-bg-hover); color: var(--text-muted); border: 1px solid var(--border-color);">Cancelar</button>
                    <a id="btnConfirmDelete" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-600 hover:bg-red-700 shadow-lg text-xs flex items-center justify-center transition">Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <div sec:authorize="hasAuthority('ROLE_ADMIN')">
        <button class="theme-switcher-btn" onclick="toggleThemePanel()"><i class="fas fa-palette"></i></button>
        <div class="theme-panel" id="themePanel">
            <h4 class="text-sm font-black uppercase text-center mb-4 border-b pb-2" style="color: var(--text-main); border-color: var(--border-color);">Elige tu estilo</h4>
            <div id="themeOptions"></div>
        </div>
    </div>

    <script th:inline="javascript">
        // Lógica de Themes
        if (typeof globalThemes !== 'undefined') {
            const themePanelOptions = document.getElementById('themeOptions');
            for (const [key, data] of Object.entries(globalThemes)) {
                const btn = document.createElement('div');
                btn.className = 'theme-option';
                btn.style.backgroundColor = data.colors.border || data.colors.highlight;
                btn.innerHTML = `<span class="w-4 h-4 rounded-full bg-white opacity-50"></span> ${data.name}`;
                btn.onclick = () => { applyThemeGlobal(key); localStorage.setItem('ctt_admin_theme', key); toggleThemePanel(); };
                themePanelOptions.appendChild(btn);
            }
        }
        function toggleThemePanel() { document.getElementById('themePanel').classList.toggle('active'); }

        // Lógica Calendario
        let eventsData = /*[[${eventosJson}]]*/ '[]';
        let events = [];
        try { events = typeof eventsData === 'string' ? JSON.parse(eventsData) : eventsData; if (!Array.isArray(events)) { events = []; } } catch (e) { events = []; }
        
        const today = new Date();
        let currentMonth = today.getMonth();
        let currentYear = today.getFullYear();

        function parseEventDate(dateArray) { if (Array.isArray(dateArray)) { return new Date(dateArray[0], dateArray[1] - 1, dateArray[2]); } return new Date(dateArray); }
        function getEventsForDate(date) { return events.filter(event => { const eventDate = parseEventDate(event.date); return eventDate.getDate() === date.getDate() && eventDate.getMonth() === date.getMonth() && eventDate.getFullYear() === date.getFullYear(); }); }

        function generateCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1);
            const lastDay = new Date(currentYear, currentMonth + 1, 0);
            const prevLastDay = new Date(currentYear, currentMonth, 0);
            const firstDayIndex = (firstDay.getDay() + 6) % 7; 
            const lastDayDate = lastDay.getDate();
            const prevLastDayDate = prevLastDay.getDate();
            const calendarGrid = document.getElementById('calendarGrid');
            
            let html = `<div class="day-header">Lun</div><div class="day-header">Mar</div><div class="day-header">Mié</div><div class="day-header">Jue</div><div class="day-header">Vie</div><div class="day-header">Sáb</div><div class="day-header">Dom</div>`;
            
            for (let i = firstDayIndex - 1; i >= 0; i--) { const day = prevLastDayDate - i; const date = new Date(currentYear, currentMonth - 1, day); const isToday = date.toDateString() === today.toDateString(); html += createDayCell(day, date, true, isToday); }
            for (let day = 1; day <= lastDayDate; day++) { const date = new Date(currentYear, currentMonth, day); const isToday = date.toDateString() === today.toDateString(); html += createDayCell(day, date, false, isToday); }
            const remainingCells = 42 - (firstDayIndex + lastDayDate);
            for (let day = 1; day <= remainingCells; day++) { const date = new Date(currentYear, currentMonth + 1, day); const isToday = date.toDateString() === today.toDateString(); html += createDayCell(day, date, true, isToday); }
            
            calendarGrid.innerHTML = html;
        }

        function createDayCell(day, date, otherMonth, isToday) {
            const dayEvents = getEventsForDate(date);
            let cssClass = 'day-cell';
            if (otherMonth) cssClass += ' other-month';
            if (isToday) cssClass += ' today';
            
            const dateStr = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}`;
            
            let eventsHtml = '';
            const maxVisible = 2;
            dayEvents.slice(0, maxVisible).forEach(event => { eventsHtml += `<div class="event">${event.title}</div>`; });
            if (dayEvents.length > maxVisible) { eventsHtml += `<div class="event-count">+${dayEvents.length - maxVisible} más</div>`; }
            
            if(dayEvents.length > 0) {
                return `<div class="${cssClass}" onclick="openDayModal('${dateStr}')"><div class="day-number">${day}</div>${eventsHtml}</div>`;
            } else {
                return `<div class="${cssClass}"><div class="day-number">${day}</div></div>`;
            }
        }

        function updateCalendar() {
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
            document.getElementById('monthYear').textContent = `${monthNames[currentMonth]} ${currentYear}`;
            generateCalendar();
        }

        function previousMonth() { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } updateCalendar(); }
        function nextMonth() { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } updateCalendar(); }
        function goToToday() { currentMonth = today.getMonth(); currentYear = today.getFullYear(); updateCalendar(); }

        const isAdmin = /*[[${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}]]*/ false;

        function openDayModal(dateStr) {
            const parts = dateStr.split('-');
            const targetDate = new Date(parts[0], parts[1] - 1, parts[2]);
            const dayEvents = getEventsForDate(targetDate);
            
            document.getElementById('modalDateTitle').innerText = `Reservas: ${parts[2].padStart(2,'0')}/${parts[1].padStart(2,'0')}/${parts[0]}`;
            
            let modalHtml = '';
            
            dayEvents.forEach(event => {
                let nombrePista = event.pista ? (event.pista.nombrePista || event.pista.nombre || 'ID: '+event.pista.id) : 'No asignada';
                
                let adminButtons = '';
                if (isAdmin) {
                    adminButtons = `
                        <div class="flex gap-2 mt-4">
                            <button onclick="cargarParaEditar(${event.id})" class="font-bold uppercase text-[10px] px-4 py-2 rounded-lg transition" style="background: var(--border-highlight); color: var(--text-main);">
                                <i class="fas fa-edit mr-1"></i> Editar
                            </button>
                            <button onclick="abrirDeleteModal(${event.id})" class="bg-red-900/30 text-red-500 font-bold uppercase text-[10px] px-4 py-2 rounded-lg hover:bg-red-600 hover:text-white transition">
                                <i class="fas fa-trash mr-1"></i> Eliminar
                            </button>
                        </div>
                    `;
                }

                modalHtml += `
                    <div class="event-detail-box">
                        <h3>${event.title}</h3>
                        <p><i class="far fa-clock"></i> <strong>Hora:</strong> ${formatTime(event.time)}</p>
                        <p><i class="fas fa-map-marker-alt"></i> <strong>Lugar:</strong> ${nombrePista}</p>
                        <p><i class="fas fa-align-left"></i> <strong>Detalle:</strong> ${event.description || 'N/A'}</p>
                        ${adminButtons}
                    </div>
                `;
            });
            
            document.getElementById('eventDetails').innerHTML = modalHtml;
            document.getElementById('eventModal').classList.add('active');
        }

        function abrirDeleteModal(id) {
            document.getElementById('btnConfirmDelete').href = '/menu_admin/calendario/eliminar/' + id;
            document.getElementById('deleteModal').classList.add('active');
            closeModal();
        }
        function cerrarDeleteModal() { document.getElementById('deleteModal').classList.remove('active'); }

        function cargarParaEditar(eventId) {
            const event = events.find(e => e.id == eventId);
            if (event) {
                document.getElementById('eventoId').value = event.id;
                document.getElementById('title').value = event.title;
                document.getElementById('date').value = formatToInputDate(event.date);
                document.getElementById('time').value = formatToInputTime(event.time);
                if(event.pista) document.getElementById('pista').value = event.pista.id;
                document.getElementById('description').value = event.description || '';
                
                document.getElementById('formTitulo').innerHTML = '<i class="fas fa-pen mr-2" style="color: var(--border-highlight);"></i>Editando Reserva';
                document.getElementById('btnSubmitForm').innerText = 'Guardar Cambios';
                document.getElementById('btnCancelEdit').classList.remove('hidden');
                
                closeModal();
                window.scrollTo({ top: 0, behavior: 'smooth' }); 
            }
        }

        function cancelarEdicion() {
            document.getElementById('eventoId').value = '';
            document.getElementById('title').value = '';
            document.getElementById('date').value = '';
            document.getElementById('time').value = '';
            document.getElementById('pista').value = '';
            document.getElementById('description').value = '';
            
            document.getElementById('formTitulo').innerHTML = '<i class="fas fa-plus-circle mr-2"></i>Nueva Actividad';
            document.getElementById('btnSubmitForm').innerText = 'Publicar Reserva';
            document.getElementById('btnCancelEdit').classList.add('hidden');
        }

        function formatToInputDate(d) { if (Array.isArray(d)) return `${d[0]}-${d[1].toString().padStart(2, '0')}-${d[2].toString().padStart(2, '0')}`; return d.substring(0, 10); }
        function formatToInputTime(t) { if (Array.isArray(t)) return `${t[0].toString().padStart(2, '0')}:${t[1].toString().padStart(2, '0')}`; return t ? t.substring(0, 5) : ''; }
        function formatTime(timeArray) { if (Array.isArray(timeArray)) return `${timeArray[0].toString().padStart(2, '0')}:${timeArray[1].toString().padStart(2, '0')}`; return timeArray || 'N/A'; }

        function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
        document.getElementById('eventModal').addEventListener('click', function(e) { if (e.target === this) { closeModal(); } });
        document.getElementById('deleteModal').addEventListener('click', function(e) { if (e.target === this) { cerrarDeleteModal(); } });
        
        updateCalendar();
    </script>
</body>
</html>
