<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Editar Equipo</title>
        <script src="/vendor/tailwind.js"></script>
    </head>
    <body class="bg-gradient-to-br from-cyan-400 to-blue-500 min-h-screen py-10 px-4">

        <div class="max-w-5xl mx-auto bg-white rounded-3xl shadow-2xl p-8">
            <h1 class="text-3xl font-bold text-blue-700 mb-6 text-center"
                th:text="'Editar Equipo: ' + ${categoria.nombre}">Editar Equipo</h1>

            <div class="flex justify-between mb-6">
                <a href="/menuAdmin/equipos"
                   class="btn block py-2 px-4 bg-gray-500 text-white rounded-lg text-sm shadow hover:bg-gray-600">
                    ← Volver a Equipos
                </a>
                <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/añadir-jugador'}"
                   class="btn block py-2 px-4 bg-green-600 text-white rounded-lg text-sm shadow hover:bg-green-700">
                    + Añadir Jugador
                </a>
            </div>

            <div th:if="${#lists.isEmpty(categoria.usuarioCategorias)}">
                <p class="text-center text-gray-500 italic">No hay jugadores en este equipo aún.</p>
            </div>

            <div th:if="${!#lists.isEmpty(categoria.usuarioCategorias)}">
                <!-- Jugadores Activos -->
                <div th:if="${!#lists.isEmpty(categoria.usuarioCategorias.?[activo])}">
                    <h2 class="text-xl font-semibold text-green-700 mb-2">Activos</h2>
                    <div class="grid grid-cols-1 gap-4 mb-6">
                        <div th:each="uc : ${categoria.usuarioCategorias.?[activo]}"
                             class="flex items-center justify-between p-4 bg-green-50 rounded-lg shadow">
                            <div class="text-lg font-medium text-gray-800"
                                 th:text="${uc.usuario.nombre + ' ' + uc.usuario.primerApellido}">Nombre Jugador</div>
                            <div class="space-x-2">
                                <!-- Botón “Hacer Suplente” si no lo es ya -->
                                <a th:if="${!uc.suplente}"
                                   th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/suplente/' + ${uc.id}}"
                                   class="py-1 px-3 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm shadow">
                                    Hacer Suplente
                                </a>
                                <!-- Botón “Eliminar” -->
                                <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/eliminar-jugador/' + ${uc.id}}"
                                   onclick="return confirm('¿Eliminar este jugador del equipo?')"
                                   class="py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600 text-sm shadow">
                                    Eliminar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Separador si hay suplentes -->
                <div th:if="${!#lists.isEmpty(categoria.usuarioCategorias.?[suplente])}">
                    <hr class="my-4 border-gray-300" />
                </div>

                <!-- Jugadores Suplentes -->
                <div th:if="${!#lists.isEmpty(categoria.usuarioCategorias.?[suplente])}">
                    <h2 class="text-xl font-semibold text-yellow-700 mb-2">Suplentes</h2>
                    <div class="grid grid-cols-1 gap-4">
                        <div th:each="uc : ${categoria.usuarioCategorias.?[suplente]}"
                             class="flex items-center justify-between p-4 bg-yellow-50 rounded-lg shadow">
                            <div class="text-lg font-medium text-gray-800"
                                 th:text="${uc.usuario.nombre + ' ' + uc.usuario.primerApellido}">Nombre Jugador</div>
                            <div class="space-x-2">
                                <!-- Botón “Activar” si no lo es ya -->
                                <a th:if="${!uc.activo}"
                                   th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/activar/' + ${uc.id}}"
                                   class="py-1 px-3 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm shadow">
                                    Activar
                                </a>
                                <!-- Botón “Eliminar” -->
                                <a th:href="@{'/menuAdmin/equipos/' + ${categoria.id} + '/eliminar-jugador/' + ${uc.id}}"
                                   onclick="return confirm('¿Eliminar este jugador del equipo?')"
                                   class="py-1 px-3 bg-red-500 text-white rounded hover:bg-red-600 text-sm shadow">
                                    Eliminar
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </body>
</html>
