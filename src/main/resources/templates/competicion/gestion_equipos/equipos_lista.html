<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inscripciones - Almendral TC</title>
    <script src="/vendor/tailwind.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
    <link href="/vendor/fonts/montserrat.css" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; background-attachment: fixed; min-height: 100vh; overflow-y: scroll; }
        
        :root { --bg-grad-1: #1f2937; --bg-grad-2: #0f172a; --card-bg: #1e293b; --card-bg-hover: #0f172a; --border-color: #334155; --border-highlight: #475569; --text-main: #f1f5f9; --text-muted: #94a3b8; --btn-bg: #334155; --btn-hover: #475569; }
        body { background: radial-gradient(circle at center, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%); color: var(--text-main); transition: background 0.5s ease; }

        .theme-card { background: var(--card-bg); border-color: var(--border-color); transition: all 0.3s ease; }
        .theme-row { background: var(--card-bg-hover); border-color: transparent; transition: all 0.3s ease; }
        .theme-text { color: var(--text-main); }
        .theme-muted { color: var(--text-muted); }
        .theme-border { border-color: var(--border-color); }
        .theme-btn { background: var(--btn-bg); color: var(--text-main); border-color: var(--border-color); }
        .theme-btn:hover { background: var(--btn-hover); border-color: var(--border-highlight); }

        body.admin-layout .main-content { margin-left: 280px; width: calc(100% - 280px); }
        body.player-layout .main-content { margin-left: 0; width: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }

        .admin-container { max-width: 1350px; width: 95%; margin: 0 auto 80px auto; border-radius: 40px; padding: 50px; box-shadow: 0 50px 100px rgba(0,0,0,0.4); border: 6px solid var(--border-color); background: var(--card-bg); }
        
        .league-divider { background: var(--bg-grad-2); padding: 30px 35px; border-radius: 20px; border-left: 8px solid var(--border-highlight); display: flex; justify-content: space-between; align-items: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); transition: 0.3s; cursor: pointer; border: 2px solid transparent;}
        .league-divider:hover { border-color: var(--border-highlight); transform: translateY(-2px); }
        
        .category-card { background: var(--bg-grad-2); border: 2px solid var(--border-highlight); border-radius: 25px; padding: 25px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.3s; height: auto; }
        
        .tech-table { width: 100%; border-collapse: separate; border-spacing: 0 8px; }
        .tech-table th { text-transform: uppercase; font-size: 0.65rem; font-weight: 900; color: var(--text-muted); padding: 5px 10px; border-bottom: 1px solid var(--border-color); }
        .tech-table td { background: var(--card-bg); padding: 10px 15px; border-radius: 10px; color: var(--text-main); border: 1px solid transparent; transition: 0.3s; height: 60px; }
        .tech-table tr:hover td { border-color: var(--border-highlight); }

        .btn-add { background: var(--btn-bg); color: var(--text-main); padding: 8px 18px; border-radius: 10px; font-weight: 800; text-transform: uppercase; font-size: 0.65rem; border: 1px solid var(--border-color); transition: all 0.2s; }
        .btn-add:hover { background: var(--border-highlight); color: white; transform: scale(1.05); }

        .gen-MASCULINO { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .gen-FEMENINO { background-color: rgba(225, 29, 72, 0.2); color: #f472b6; border: 1px solid #ec4899; }
        .gen-MIXTO { background-color: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #22c55e; }

        .cat-pag-controls { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 15px; border-top: 2px dashed var(--border-color); }
        .cat-btn { padding: 8px 15px; border-radius: 8px; font-size: 0.7rem; font-weight: 900; background: var(--btn-bg); color: var(--text-main); cursor: pointer; transition: 0.2s; border: 1px solid var(--border-color); text-transform: uppercase;}
        .cat-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .cat-btn:hover:not(:disabled) { background: var(--border-highlight); border-color: var(--border-highlight); }

        .theme-switcher-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 3px solid var(--border-highlight); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 999; transition: 0.3s; }
        .theme-switcher-btn:hover { transform: rotate(45deg) scale(1.1); }
        .theme-panel { position: fixed; bottom: 100px; right: 30px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; padding: 20px; width: 250px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 998; display: none; opacity: 0; transition: 0.3s; }
        .theme-panel.active { display: block; opacity: 1; }
        .theme-option { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-weight: bold; text-align: left; display: flex; align-items: center; gap: 10px; transition: 0.2s; color: white; }
        .theme-option:hover { transform: translateX(5px); border-color: rgba(255,255,255,0.3); }
        
        @media (max-width: 768px) { body.admin-layout .main-content { margin-left: 70px; width: calc(100% - 70px); } }
    </style>
</head>
<body th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'admin-layout' : 'player-layout'">
    
    <div sec:authorize="hasAuthority('ROLE_ADMIN')">
        <div th:replace="fragments/sidebar :: sidebar"></div>
    </div>

    <div class="main-content">
        <header class="py-10 text-center w-full relative">
            <h1 class="inline-block theme-card px-12 py-4 rounded-full border-4 text-3xl font-900 uppercase tracking-widest shadow-2xl theme-text">Mis Equipos</h1>
        </header>

        <main class="admin-container">
            <div class="flex justify-between items-center mb-8 border-b pb-4 theme-border">
                <a th:href="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? '/menu_admin' : '/menu_principal'" 
                   class="text-xs font-bold uppercase tracking-widest transition inline-flex items-center gap-2 theme-muted hover:text-white">
                    <i class="fas fa-arrow-left"></i> Volver al Menú
                </a>
                
                <div sec:authorize="hasAuthority('ROLE_ADMIN')">
                    <a href="/ligas" class="theme-btn px-6 py-3 rounded-xl text-[11px] uppercase font-black shadow-lg">
                        <i class="fas fa-cog mr-1"></i> Configurar Ligas
                    </a>
                </div>
            </div>

            <div th:each="liga : ${ligas}" class="mb-10">
                <div class="league-divider" onclick="toggleLigaCollapse(this)">
                    <div>
                        <h2 class="text-xl font-900 uppercase leading-none mb-2 theme-text" th:text="${liga.nombre}">Nombre</h2>
                        <p class="text-sm font-medium theme-muted" th:text="${liga.descripcion}"></p>
                    </div>
                    <div class="flex items-center ml-4">
                        <i class="fas fa-chevron-down text-2xl theme-muted transition-transform duration-300 liga-toggle-icon"></i>
                    </div>
                </div>

                <div class="liga-body hidden mt-6">
                    <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-8 items-start">
                        <div th:each="categoria : ${liga.categorias}" class="category-card" th:attr="data-cat-id=${categoria.id}">
                            
                            <div class="flex justify-between items-center pb-2">
                                <div>
                                    <h3 class="text-sm font-900 uppercase theme-text" th:text="${categoria.nombre}">Categoría</h3>
                                    <span class="text-[9px] font-black uppercase tracking-widest px-2 py-1 rounded-md mt-1 inline-block"
                                          th:classappend="'gen-' + ${categoria.genero}" th:text="${categoria.genero}">GENERO</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{'/equipos/' + ${categoria.id} + '/anadir-jugador'}" class="btn-add"><i class="fas fa-plus"></i> Inscribir</a>
                                </div>
                            </div>

                            <div class="cat-body flex-grow flex flex-col mt-4 pt-4 border-t theme-border">
                                <table class="tech-table">
                                    <thead>
                                        <tr>
                                            <th class="text-left">Compañeros</th>
                                            <th sec:authorize="hasAuthority('ROLE_ADMIN')" class="text-right w-[85px]">Gestión</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="uc : ${categoria.usuarioCategorias}" class="uc-row" th:id="'row-uc-' + ${uc.id}">
                                            <td class="w-full" style="max-width: 0;">
                                                <div class="text-xs font-black uppercase flex items-center gap-2" th:style="${uc.usuario.capitan == true ? 'color: #fbbf24;' : 'color: var(--text-main);'}">
                                                    <i th:if="${uc.usuario.capitan == true}" class="fas fa-star text-amber-400 text-sm flex-shrink-0" title="Capitán"></i>
                                                    <span class="truncate block" th:text="${uc.usuario.nombre + ' ' + uc.usuario.primerApellido}">Nombre</span>
                                                    <span th:if="${uc.usuario.capitan == true}" class="text-[8px] bg-amber-900/40 text-amber-300 px-2 py-0.5 rounded border border-amber-600 shadow-md flex-shrink-0">CAPITÁN</span>
                                                </div>
                                                
                                                <span th:id="'status-span-' + ${uc.id}"
                                                      th:class="${uc.activo} ? 'text-[8px] text-emerald-400 font-black uppercase mt-1 block' : 'text-[8px] text-slate-500 font-black uppercase mt-1 block'"
                                                      th:text="${uc.activo ? '● ACTIVO' : '○ INACTIVO'}"></span>
                                            </td>
                                            <td sec:authorize="hasAuthority('ROLE_ADMIN')" class="text-right whitespace-nowrap">
                                                <div class="flex justify-end gap-1">
                                                    <button th:id="'btn-toggle-' + ${uc.id}"
                                                            th:attr="onclick=|toggleStatus(event, ${uc.id})|"
                                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg border transition cursor-pointer flex-shrink-0"
                                                            th:classappend="${uc.activo} ? 'bg-emerald-900/30 border-emerald-800 text-emerald-400 hover:bg-emerald-600 hover:text-white' : 'bg-slate-800 border-slate-700 text-slate-500 hover:bg-slate-600 hover:text-white'">
                                                        <i class="fas fa-sync-alt text-[10px]"></i>
                                                    </button>
                                                    <button th:onclick="'openDeleteModal(' + ${uc.id} + ');'" 
                                                            class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-red-900 bg-red-900/30 text-red-500 hover:bg-red-600 hover:text-white transition cursor-pointer flex-shrink-0">
                                                        <i class="fas fa-user-minus text-[10px]"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div th:if="${#lists.isEmpty(categoria.usuarioCategorias)}" class="text-center py-6 border-2 border-dashed theme-border rounded-xl mt-4">
                                    <span class="text-[9px] font-bold theme-muted uppercase tracking-widest">Sin integrantes</span>
                                </div>

                                <div class="cat-pag-controls mt-auto" th:if="${!#lists.isEmpty(categoria.usuarioCategorias)}">
                                    <button class="cat-btn" th:id="'prev-cat-' + ${categoria.id}" th:attr="onclick=|changeCatPage(event, ${categoria.id}, -1)|"><i class="fas fa-chevron-left mr-1"></i> Ant</button>
                                    <span class="text-[10px] font-black theme-muted tracking-widest" th:id="'info-cat-' + ${categoria.id}">1 / X</span>
                                    <button class="cat-btn" th:id="'next-cat-' + ${categoria.id}" th:attr="onclick=|changeCatPage(event, ${categoria.id}, 1)|">Sig <i class="fas fa-chevron-right ml-1"></i></button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div sec:authorize="hasAuthority('ROLE_ADMIN')" id="deleteModal" class="fixed inset-0 z-[500] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="theme-card transform scale-95 transition-transform w-full mx-4" id="deleteModalContent" style="max-width: 450px; padding: 50px; border-radius: 30px;">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-900/30 rounded-full flex items-center justify-center mb-6"><i class="fas fa-exclamation-triangle text-4xl text-red-500"></i></div>
                <h3 class="text-2xl font-black uppercase theme-text mb-3">¿Estás seguro?</h3>
                <p class="theme-muted font-medium mb-10 text-sm">Se dará de baja al jugador de este equipo en vivo.</p>
                <div class="flex gap-4 justify-center">
                    <button onclick="closeDeleteModal()" class="w-full py-4 rounded-xl font-bold uppercase theme-muted theme-btn text-xs">Cancelar</button>
                    <button id="confirmDeleteBtn" class="w-full py-4 rounded-xl font-bold uppercase text-white bg-red-600 hover:bg-red-700 shadow-lg text-xs flex items-center justify-center">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <div sec:authorize="hasAuthority('ROLE_ADMIN')">
        <button class="theme-switcher-btn" onclick="toggleThemePanel()"><i class="fas fa-palette"></i></button>
        <div class="theme-panel" id="themePanel">
            <h4 class="text-sm font-black uppercase text-center mb-4 theme-text border-b pb-2 theme-border">Elige tu estilo</h4>
            <div id="themeOptions"></div>
        </div>
        <script>
            if (typeof globalThemes !== 'undefined') {
                const themePanelOptions = document.getElementById('themeOptions');
                for (const [key, data] of Object.entries(globalThemes)) {
                    const btn = document.createElement('div');
                    btn.className = 'theme-option';
                    btn.style.backgroundColor = data.colors.border || data.colors.highlight;
                    btn.innerHTML = `<span class="w-4 h-4 rounded-full bg-white opacity-50"></span> ${data.name}`;
                    btn.onclick = () => { applyThemeGlobal(key); localStorage.setItem('ctt_admin_theme', key); toggleThemePanel(); };
                    themePanelOptions.appendChild(btn);
                }
            }
            function toggleThemePanel() { document.getElementById('themePanel').classList.toggle('active'); }
        </script>
    </div>

    <script>
        function toggleLigaCollapse(header) {
            const body = header.nextElementSibling;
            const icon = header.querySelector('.liga-toggle-icon');
            if(body.classList.contains('hidden')) {
                body.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                body.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        const catStates = {};
        const itemsPerCat = 5;

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll('.category-card').forEach(card => {
                const catId = card.getAttribute('data-cat-id');
                const rows = Array.from(card.querySelectorAll('.uc-row'));
                if(rows.length > 0) {
                    catStates[catId] = { page: 1, rows: rows, total: rows.length };
                    renderCatPage(catId);
                }
            });
        });

        function renderCatPage(catId) {
            const state = catStates[catId];
            if(!state) return;
            
            state.rows = state.rows.filter(r => document.getElementById(r.id)); 
            state.total = state.rows.length;

            const maxPage = Math.max(1, Math.ceil(state.total / itemsPerCat));
            if(state.page > maxPage) state.page = maxPage;

            const start = (state.page - 1) * itemsPerCat;
            const end = start + itemsPerCat;

            state.rows.forEach((row, index) => {
                row.style.display = (index >= start && index < end) ? '' : 'none';
            });

            const prev = document.getElementById('prev-cat-' + catId);
            const next = document.getElementById('next-cat-' + catId);
            const info = document.getElementById('info-cat-' + catId);
            
            if(prev) prev.disabled = (state.page === 1);
            if(next) next.disabled = (state.page === maxPage || state.total === 0);
            if(info) info.innerText = `${state.page} / ${maxPage}`;
        }

        function changeCatPage(event, catId, dir) {
            event.stopPropagation();
            if(catStates[catId]) {
                catStates[catId].page += dir;
                renderCatPage(catId);
            }
        }

        function toggleStatus(e, ucId) {
            e.preventDefault();
            e.stopPropagation();
            const btn = document.getElementById('btn-toggle-' + ucId);
            const span = document.getElementById('status-span-' + ucId);
            
            const isActive = span.innerText.includes('●');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-[10px]"></i>';

            fetch('/equipos/inscripcion/toggle-estatus/' + ucId, { method: 'GET' })
            .then(res => {
                if(isActive) {
                    span.innerText = '○ INACTIVO';
                    span.className = 'text-[8px] text-slate-500 font-black uppercase mt-1 block';
                    btn.className = 'inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-700 bg-slate-800 text-slate-500 hover:bg-slate-600 hover:text-white transition cursor-pointer flex-shrink-0';
                } else {
                    span.innerText = '● ACTIVO';
                    span.className = 'text-[8px] text-emerald-400 font-black uppercase mt-1 block';
                    btn.className = 'inline-flex items-center justify-center w-8 h-8 rounded-lg border border-emerald-800 bg-emerald-900/30 text-emerald-400 hover:bg-emerald-600 hover:text-white transition cursor-pointer flex-shrink-0';
                }
                btn.innerHTML = '<i class="fas fa-sync-alt text-[10px]"></i>';
            })
            .catch(err => {
                btn.innerHTML = '<i class="fas fa-exclamation-triangle text-[10px] text-red-500"></i>';
            });
        }

        let currentDeleteId = null;

        function openDeleteModal(ucId) {
            currentDeleteId = ucId;
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('hidden');
            setTimeout(() => document.getElementById('deleteModalContent').classList.replace('scale-95', 'scale-100'), 10);
            
            document.getElementById('confirmDeleteBtn').onclick = function() {
                const btn = this;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                
                fetch('/equipos/inscripcion/eliminar/' + currentDeleteId, { method: 'GET' })
                .then(res => {
                    const row = document.getElementById('row-uc-' + currentDeleteId);
                    if(row) {
                        const card = row.closest('.category-card');
                        const catId = card.getAttribute('data-cat-id');
                        row.remove();
                        if(catId) renderCatPage(catId);
                    }
                    closeDeleteModal();
                    btn.innerHTML = 'Eliminar';
                })
                .catch(err => {
                    btn.innerHTML = 'Error';
                });
            }
        }

        function closeDeleteModal() {
            document.getElementById('deleteModalContent').classList.replace('scale-100', 'scale-95');
            setTimeout(() => document.getElementById('deleteModal').classList.add('hidden'), 300);
        }
    </script>
</body>
</html>
