<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Roles - Almendral TC</title>
    <link href="/vendor/fonts/montserrat.css" rel="stylesheet">
    <script src="/vendor/tailwind.js"></script>
    <style>
        .theme-admin { --bg-page: radial-gradient(circle at center, #2d3748 0%, #0f172a 100%); --accent: #94a3b8; }
        :root { --atc-carbono: #1a1a1a; --atc-gris-borde: #475569; --atc-acero-luz: #e2e8f0; }

        body { font-family: 'Montserrat', sans-serif; background: var(--bg-page); background-attachment: fixed; min-height: 100vh; margin: 0; }
        .header-section { padding: 50px 20px 40px 20px; text-align: center; }
        .main-pill-title { background: #000000; color: white; padding: 15px 80px; border-radius: 100px; font-weight: 900; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 30px 60px rgba(0,0,0,0.6); display: inline-block; border: 4px solid var(--accent); }
        
        .list-container { max-width: 800px; margin: 0 auto 80px auto; background: rgba(255, 255, 255, 0.98); border-radius: 40px; padding: 50px; border: 6px solid var(--atc-gris-borde); box-shadow: 0 50px 100px rgba(0,0,0,0.5); }
        
        .role-grid-layout { display: grid; grid-template-columns: 80px 1fr 100px; align-items: center; gap: 15px; }
        .role-row { padding: 20px 30px; border-radius: 20px; margin-bottom: 10px; border: 2px solid #f1f5f9; background: white; transition: 0.3s; }
        .role-row:hover { transform: scale(1.02); border-color: var(--accent); background: #f8fafc; }

        .role-badge-tech { background: var(--atc-carbono); color: white; padding: 6px 15px; border-radius: 10px; font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; border: 1px solid var(--accent); }
        
        .action-btn-delete { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: #fee2e2; border: 1px solid #ef4444; color: #b91c1c; transition: 0.2s; }
        .action-btn-delete:hover { background: #b91c1c; color: white; }
        
        .nav-link-tech { font-weight: 900; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 3px; color: var(--accent); display: inline-flex; align-items: center; gap: 10px; transition: 0.3s; }
        .btn-add-role { background: #000; color: white; padding: 12px 25px; border-radius: 15px; font-weight: 800; text-transform: uppercase; font-size: 0.75rem; border: 2px solid var(--accent); transition: 0.3s; }
        .btn-add-role:hover { background: var(--accent); transform: translateY(-2px); }
    </style>
</head>
<body class="theme-admin pb-20">

    <header class="header-section">
        <h1 class="main-pill-title">Jerarquía de Roles</h1>
    </header>

    <main class="list-container">
        <div class="flex justify-between items-center mb-12">
            <a href="/menu_admin" class="nav-link-tech">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                Menú Administrativo
            </a>
            <a href="/roles/nuevo" class="btn-add-role">+ Definir Rol</a>
        </div>

        <div class="hidden md:grid role-grid-layout px-8 mb-4 text-[10px] font-black uppercase tracking-[3px] text-slate-400">
            <span>ID</span><span>Identificador de Sistema</span><span class="text-right">Acción</span>
        </div>

        <div id="roleList" class="space-y-2">
            <div th:each="rol : ${roles}" class="role-row role-grid-layout">
                <span class="font-black text-slate-300" th:text="${rol.id}">01</span>
                <div>
                    <span class="role-badge-tech" th:text="${rol.nombreRol}">ROLE_ADMIN</span>
                </div>
                <div class="flex justify-end">
                    <a th:href="@{'/roles/eliminar/' + ${rol.id}}" 
                       onclick="return confirm('¿Revocar este nivel de acceso permanentemente?')"
                       class="action-btn-delete">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </a>
                </div>
            </div>
        </div>
        
        <div th:if="${roles.empty}" class="py-20 text-center border-4 border-dashed border-slate-100 rounded-[40px]">
            <p class="text-slate-300 font-black uppercase text-xs tracking-[5px]">No system roles defined</p>
        </div>
    </main>

    <footer class="text-center opacity-30">
        <p class="text-[9px] text-white font-black uppercase tracking-[10px]">Access Control Core 2026</p>
    </footer>

</body>
</html>
