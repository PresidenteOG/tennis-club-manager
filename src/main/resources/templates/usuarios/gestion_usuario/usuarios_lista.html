<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Usuarios - Almendral TC</title>
    <link href="/vendor/fonts/montserrat.css" rel="stylesheet">
    <script src="/vendor/tailwind.js"></script>
    <link rel="stylesheet" href="/vendor/fontawesome/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root { --bg-grad-1: #1f2937; --bg-grad-2: #0f172a; --card-bg: #1e293b; --card-bg-hover: #0f172a; --border-color: #334155; --border-highlight: #475569; --text-main: #f1f5f9; --text-muted: #94a3b8; --btn-bg: #334155; --btn-hover: #475569; }
        body { font-family: 'Montserrat', sans-serif; margin: 0; display: flex; background: radial-gradient(circle at center, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%); background-attachment: fixed; color: var(--text-main); min-height: 100vh; overflow-y: scroll; transition: background 0.5s ease; }
        
        /* ADAPTACIÓN DINÁMICA SEGÚN ROL */
        body.admin-layout .main-content { margin-left: 280px; width: calc(100% - 280px); }
        body.player-layout .main-content { margin-left: 0; width: 100%; }
        .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; position: relative; }

        .theme-card { background: var(--card-bg); border-color: var(--border-color); transition: all 0.3s ease; }
        .theme-row { background: var(--card-bg-hover); border-color: transparent; transition: all 0.3s ease; }
        .theme-text { color: var(--text-main); }
        .theme-muted { color: var(--text-muted); }
        .theme-border { border-color: var(--border-color); }
        .theme-input { background: var(--card-bg-hover); border-color: var(--border-color); color: var(--text-main); }
        .theme-input:focus { border-color: var(--border-highlight); }
        .theme-btn { background: var(--btn-bg); color: var(--text-main); }
        .theme-btn:hover { background: var(--border-highlight); border-color: var(--border-highlight); }

        /* DROPDOWNS PREMIUM CON ICONOS */
        .custom-select-wrapper { position: relative; min-width: 190px; user-select: none; z-index: 50; }
        .custom-select-btn { width: 100%; padding: 12px 16px; border-radius: 1rem; font-weight: bold; border: 2px solid var(--border-color); background: var(--card-bg-hover); color: var(--text-main); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.3s; outline: none; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
        .custom-select-btn:hover { border-color: var(--border-highlight); }
        .custom-select-menu { position: absolute; top: calc(100% + 8px); left: 0; width: 100%; background: var(--card-bg); border: 2px solid var(--border-highlight); border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: none; flex-direction: column; overflow: hidden; }
        .custom-select-menu.active { display: flex; }
        .custom-select-option { padding: 12px 16px; cursor: pointer; font-weight: bold; font-size: 0.75rem; color: var(--text-main); border-bottom: 1px solid var(--border-color); transition: background 0.2s; display: flex; align-items: center; gap: 10px; }
        .custom-select-option:last-child { border-bottom: none; }
        .custom-select-option:hover { background-color: var(--border-highlight); }

        .list-container { max-width: 1250px; width: 95%; margin-top: 30px; border-radius: 40px; padding: 40px; border: 4px solid; box-shadow: 0 20px 50px rgba(0,0,0,0.4); border-color: var(--border-color); }
        .user-grid-layout { display: grid; grid-template-columns: 80px 1.5fr 1fr 1fr 100px; align-items: center; gap: 15px; }
        .user-row { padding: 12px 25px; border-radius: 20px; margin-bottom: 10px; border: 3px solid transparent; transition: 0.3s; }
        .user-row:hover { border-color: var(--border-highlight); transform: scale(1.015); background: var(--card-bg-hover); }

        .gen-MASCULINO { background-color: rgba(37, 99, 235, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
        .gen-FEMENINO { background-color: rgba(225, 29, 72, 0.2); color: #f472b6; border: 1px solid #ec4899; }
        .gen-MIXTO { background-color: rgba(22, 163, 74, 0.2); color: #4ade80; border: 1px solid #22c55e; }

        .pagination-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; padding-top: 20px; border-top: 2px solid var(--border-color); }
        .page-btn { padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; border: none; outline: none; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .theme-switcher-btn { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: var(--card-bg); border: 3px solid var(--border-highlight); color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 999; transition: 0.3s; }
        .theme-switcher-btn:hover { transform: rotate(45deg) scale(1.1); }
        .theme-panel { position: fixed; bottom: 100px; right: 30px; background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; padding: 20px; width: 250px; box-shadow: 0 15px 40px rgba(0,0,0,0.8); z-index: 998; display: none; opacity: 0; transition: 0.3s; }
        .theme-panel.active { display: block; opacity: 1; }
        .theme-option { width: 100%; padding: 10px; margin-bottom: 8px; border-radius: 10px; border: 2px solid transparent; cursor: pointer; font-weight: bold; text-align: left; display: flex; align-items: center; gap: 10px; transition: 0.2s; color: white; }

        @media (max-width: 768px) { body.admin-layout .main-content { margin-left: 70px; width: calc(100% - 70px); } .user-grid-layout{ display: block !important; } .user-row{ margin-bottom: 15px;} }
    </style>
</head>
<body th:classappend="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'admin-layout' : 'player-layout'">
    
    <div th:if="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')}" th:replace="fragments/sidebar :: sidebar"></div>

    <div class="main-content">
        <a th:href="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? '/menu_admin' : '/menu_normal'" 
           class="absolute top-6 left-6 flex items-center gap-2 font-900 uppercase text-[10px] tracking-[3px] transition z-50 theme-muted hover:text-white"
           th:style="${#authorization.expression('hasAuthority(''ROLE_ADMIN'')')} ? 'left: 310px;' : 'left: 20px;'">
            <i class="fas fa-arrow-left"></i> Volver a mi menú
        </a>

        <header class="py-10 text-center w-full relative">
            <h1 class="theme-card px-16 py-4 rounded-full font-black text-3xl uppercase inline-block border-4 shadow-xl tracking-wider theme-text mb-6">Usuarios</h1>
            
            <div class="max-w-[1250px] mx-auto px-4 w-full space-y-4">
                <div class="flex flex-col md:flex-row gap-4">
                    <div class="relative flex-1 z-10">
                        <i class="fas fa-search absolute left-4 top-[14px] theme-muted"></i>
                        <input type="text" id="search" placeholder="Buscar por nombre, email, DNI..." class="w-full pl-12 pr-4 py-3 rounded-2xl font-bold border-2 outline-none shadow-md theme-input">
                    </div>
                    <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/usuarios/nuevo}" class="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-2xl font-black uppercase tracking-widest shadow-md flex items-center justify-center gap-2 transition-colors flex-shrink-0 z-10">
                        <i class="fas fa-user-plus"></i> Nuevo
                    </a>
                </div>
                
                <div class="flex flex-wrap justify-center gap-4">
                    <div class="custom-select-wrapper">
                        <div class="custom-select-btn">
                            <span class="custom-select-text"><i class="fas fa-sort-alpha-down mr-2 theme-muted"></i> Orden: A-Z</span>
                            <i class="fas fa-chevron-down theme-muted transition-transform duration-300"></i>
                        </div>
                        <div class="custom-select-menu">
                            <div class="custom-select-option" data-val="AZ"><i class="fas fa-sort-alpha-down mr-2 theme-muted"></i> Orden: A-Z</div>
                            <div class="custom-select-option" data-val="ZA"><i class="fas fa-sort-alpha-up mr-2 theme-muted"></i> Orden: Z-A</div>
                            <div class="custom-select-option" data-val="NEW"><i class="fas fa-clock mr-2 theme-muted"></i> Más recientes</div>
                        </div>
                        <input type="hidden" class="filter-input" id="filterSort" value="AZ">
                    </div>

                    <div class="custom-select-wrapper">
                        <div class="custom-select-btn">
                            <span class="custom-select-text"><i class="fas fa-user-tag mr-2 theme-muted"></i> Roles</span>
                            <i class="fas fa-chevron-down theme-muted"></i>
                        </div>
                        <div class="custom-select-menu">
                            <div class="custom-select-option" data-val=""><i class="fas fa-users mr-2 theme-muted"></i> Todos los Roles</div>
                            <div class="custom-select-option" data-val="ADMIN"><i class="fas fa-shield-alt mr-2 text-red-400"></i> Administradores</div>
                            <div class="custom-select-option" data-val="JUGADOR"><i class="fas fa-table-tennis mr-2 text-blue-400"></i> Jugadores</div>
                        </div>
                        <input type="hidden" class="filter-input" id="filterRole" value="">
                    </div>

                    <div class="custom-select-wrapper">
                        <div class="custom-select-btn">
                            <span class="custom-select-text"><i class="fas fa-venus-mars mr-2 theme-muted"></i> Género</span>
                            <i class="fas fa-chevron-down theme-muted"></i>
                        </div>
                        <div class="custom-select-menu">
                            <div class="custom-select-option" data-val=""><i class="fas fa-venus-mars mr-2 theme-muted"></i> Todos</div>
                            <div class="custom-select-option" data-val="MASCULINO"><i class="fas fa-mars mr-2 text-blue-400"></i> Masculino</div>
                            <div class="custom-select-option" data-val="FEMENINO"><i class="fas fa-venus mr-2 text-pink-400"></i> Femenino</div>
                        </div>
                        <input type="hidden" class="filter-input" id="filterGender" value="">
                    </div>

                    <div class="custom-select-wrapper">
                        <div class="custom-select-btn">
                            <span class="custom-select-text"><i class="fas fa-star mr-2 theme-muted"></i> Capitanes</span>
                            <i class="fas fa-chevron-down theme-muted"></i>
                        </div>
                        <div class="custom-select-menu">
                            <div class="custom-select-option" data-val=""><i class="fas fa-users mr-2 theme-muted"></i> Todos</div>
                            <div class="custom-select-option" data-val="true"><i class="fas fa-star mr-2 text-amber-400"></i> Solo Capitanes</div>
                            <div class="custom-select-option" data-val="false"><i class="far fa-star mr-2 theme-muted"></i> No Capitanes</div>
                        </div>
                        <input type="hidden" class="filter-input" id="filterCaptain" value="">
                    </div>
                </div>
            </div>
        </header>

        <main class="list-container theme-card" id="tableContainer">
            <div class="hidden md:grid user-grid-layout px-8 mb-4 text-[9px] font-black uppercase tracking-[3px] theme-muted mt-2">
                <span>Perfil</span><span>Identidad</span><span>Email</span><span>Roles</span><span class="text-right">Gestión</span>
            </div>

            <div id="lista" class="space-y-2 min-h-[450px]">
                <div th:each="u : ${usuarios}" 
                     class="user-row theme-row user-grid-layout" 
                     th:data-genero="${u.genero}"
                     th:data-capitan="${u.capitan != null && u.capitan ? 'true' : 'false'}"
                     th:data-nombre-completo="${#strings.toLowerCase(u.nombre + ' ' + u.primerApellido)}"
                     th:data-id="${u.id}"
                     th:data-roles="${#strings.listJoin(u.roles.![nombreRol.replace('ROLE_', '')], ',')}">
                     
                    <div class="relative w-16 h-16 cursor-pointer group" onclick="openImagePreview(this.querySelector('img').src)">
                        <img th:src="${u.avatar != null && !u.avatar.isEmpty()} ? @{/images/{path}(path=${u.avatar})} : @{/vendor/default-avatar.svg} + ${u.nombre} + '&background=random&color=fff'"
                             class="w-full h-full object-cover rounded-2xl shadow-sm border-2 theme-border">
                    </div>

                    <div class="flex flex-col">
                        <div class="flex items-center gap-2">
                            <span class="font-black text-sm uppercase theme-text" th:text="${u.nombre + ' ' + u.primerApellido}"></span>
                            <i th:if="${u.capitan}" class="fas fa-star text-amber-500 text-xs"></i>
                        </div>
                        <div class="flex items-center gap-2 mt-1">
                            <span class="text-[9px] font-bold theme-muted uppercase" th:text="${u.dni}"></span>
                            <span th:if="${u.genero != null}" class="text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md"
                                  th:classappend="'gen-' + ${u.genero}" th:text="${u.genero}"></span>
                        </div>
                    </div>
                    
                    <span class="text-xs font-bold theme-muted truncate" th:text="${u.email}"></span>
                    
                    <div class="flex flex-wrap gap-1 roles-container">
                        <span th:each="rol : ${u.roles}" class="theme-card theme-text border px-2 py-1 rounded text-[8px] font-black uppercase shadow-sm" 
                              th:text="${rol.nombreRol.replace('ROLE_', '')}"
                              th:style="${rol.nombreRol == 'ROLE_ADMIN' ? 'border-color: #ef4444; color: #f87171;' : 'border-color: #3b82f6; color: #60a5fa;'}"></span>
                    </div>
                    
                    <div class="flex justify-end gap-2">
                        <a th:href="@{'/usuarios/editar/' + ${u.id}}" class="w-9 h-9 flex items-center justify-center rounded-xl theme-btn shadow-md hover:bg-amber-500 transition-colors" title="Editar"><i class="fas fa-edit"></i></a>
                        <button sec:authorize="hasAuthority('ROLE_ADMIN')" th:attr="onclick=|openDeleteModal('/usuarios/eliminar/${u.id}')|" class="w-9 h-9 flex items-center justify-center rounded-xl bg-red-900/20 text-red-400 hover:bg-red-600 hover:text-white transition-all shadow-md" title="Eliminar"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            </div>

            <div class="pagination-controls" id="paginationBox">
                <button id="prevBtn" class="page-btn theme-btn" onclick="changePage(-1)" disabled>Anterior</button>
                <span id="pageInfo" class="font-black uppercase text-xs theme-muted tracking-widest"></span>
                <button id="nextBtn" class="page-btn theme-btn" onclick="changePage(1)" disabled>Siguiente</button>
            </div>
        </main>
    </div>

    <div id="imagePreviewModal" class="fixed inset-0 z-[300] hidden flex items-center justify-center bg-black/90 backdrop-blur-sm" onclick="closeImagePreview()">
        <img id="modalPreviewImg" class="max-w-[90%] max-h-[90%] rounded-2xl shadow-2xl border-4 theme-border">
    </div>

    <div id="deleteModal" class="fixed inset-0 z-[500] hidden flex items-center justify-center bg-black/80 backdrop-blur-sm transition-opacity">
        <div class="theme-card max-w-sm w-full mx-4 shadow-2xl rounded-3xl p-8 transform scale-95 transition-transform" id="deleteModalContent">
            <div class="text-center">
                <div class="w-20 h-20 mx-auto bg-red-900/30 rounded-full flex items-center justify-center mb-6"><i class="fas fa-exclamation-triangle text-4xl text-red-500"></i></div>
                <h3 class="text-2xl font-black uppercase theme-text mb-3">¿Eliminar?</h3>
                <div class="flex gap-4 justify-center mt-6">
                    <button onclick="closeDeleteModal()" class="w-full py-3 rounded-xl font-bold uppercase theme-muted theme-btn text-xs">Cancelar</button>
                    <a id="confirmDeleteBtn" href="#" class="w-full py-3 rounded-xl font-bold uppercase text-white bg-red-600 shadow-lg text-xs flex items-center justify-center">Sí, Eliminar</a>
                </div>
            </div>
        </div>
    </div>

    <button sec:authorize="hasAuthority('ROLE_ADMIN')" class="theme-switcher-btn" onclick="toggleThemePanel()"><i class="fas fa-palette"></i></button>
    <div class="theme-panel" id="themePanel">
        <h4 class="text-sm font-black uppercase text-center mb-4 theme-text border-b pb-2 theme-border">Estilos</h4>
        <div id="themeOptions"></div>
    </div>

    <script>
        // MOTOR DE FILTRADO Y PAGINACIÓN
        const itemsPerPage = 8;
        let currentPage = 1;
        const allItems = Array.from(document.querySelectorAll('.user-row'));
        const listaContenedor = document.getElementById('lista');

        // LÓGICA DE LOS SELECTORES
        document.querySelectorAll('.custom-select-wrapper').forEach(wrapper => {
            const btn = wrapper.querySelector('.custom-select-btn');
            const menu = wrapper.querySelector('.custom-select-menu');
            const input = wrapper.querySelector('.filter-input');
            const textSpan = wrapper.querySelector('.custom-select-text');

            btn.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.custom-select-menu.active').forEach(m => m !== menu && m.classList.remove('active'));
                menu.classList.toggle('active');
            };

            menu.querySelectorAll('.custom-select-option').forEach(opt => {
                opt.onclick = (e) => {
                    e.stopPropagation();
                    const val = opt.getAttribute('data-val');
                    input.value = val;
                    textSpan.innerHTML = opt.innerHTML; // Copia el icono y el texto
                    menu.classList.remove('active');
                    currentPage = 1;
                    updateList();
                };
            });
        });

        document.addEventListener('click', () => {
            document.querySelectorAll('.custom-select-menu.active').forEach(m => m.classList.remove('active'));
        });

        function updateList() {
            const searchVal = document.getElementById('search').value.toLowerCase();
            const genderVal = document.getElementById('filterGender').value;
            const roleVal = document.getElementById('filterRole').value;
            const captainVal = document.getElementById('filterCaptain').value;
            const sortVal = document.getElementById('filterSort').value;

            // FILTRAR
            let filtered = allItems.filter(row => {
                const rowText = row.getAttribute('data-nombre-completo') + row.innerText.toLowerCase();
                const matchesSearch = rowText.includes(searchVal);
                const matchesGender = !genderVal || row.getAttribute('data-genero') === genderVal;
                const matchesCaptain = !captainVal || row.getAttribute('data-capitan') === captainVal;
                
                // Filtro de roles por data-attribute (robusto)
                const rowRoles = row.getAttribute('data-roles') || '';
                const matchesRole = !roleVal || rowRoles.includes(roleVal);

                return matchesSearch && matchesGender && matchesCaptain && matchesRole;
            });

            // ORDENAR
            filtered.sort((a, b) => {
                if (sortVal === 'AZ') return a.getAttribute('data-nombre-completo').localeCompare(b.getAttribute('data-nombre-completo'));
                if (sortVal === 'ZA') return b.getAttribute('data-nombre-completo').localeCompare(a.getAttribute('data-nombre-completo'));
                if (sortVal === 'NEW') return b.getAttribute('data-id') - a.getAttribute('data-id');
                return 0;
            });

            // RENDERIZAR
            allItems.forEach(r => r.style.display = 'none');
            const total = filtered.length;
            const totalPages = Math.ceil(total / itemsPerPage) || 1;
            
            filtered.slice((currentPage-1)*itemsPerPage, currentPage*itemsPerPage).forEach(r => {
                listaContenedor.appendChild(r);
                r.style.display = '';
            });

            document.getElementById('pageInfo').innerText = `Página ${currentPage} de ${totalPages} (${total} regs)`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages || total === 0;
        }

        function changePage(dir) { currentPage += dir; updateList(); }
        document.getElementById('search').oninput = () => { currentPage = 1; updateList(); };

        // INICIALIZAR
        updateList();

        // TEMAS Y OTROS
        if(typeof globalThemes !== 'undefined'){
            const themePanelOptions = document.getElementById('themeOptions');
            for (const [key, data] of Object.entries(globalThemes)) {
                const btn = document.createElement('div');
                btn.className = 'theme-option';
                btn.style.backgroundColor = data.colors.border || data.colors.highlight;
                btn.innerHTML = `<span class="w-3 h-3 rounded-full bg-white opacity-40"></span> ${data.name}`;
                btn.onclick = () => { applyThemeGlobal(key); localStorage.setItem('ctt_admin_theme', key); toggleThemePanel(); };
                themePanelOptions.appendChild(btn);
            }
        }
        function toggleThemePanel() { document.getElementById('themePanel').classList.toggle('active'); }
        function openImagePreview(src) { document.getElementById('modalPreviewImg').src = src; document.getElementById('imagePreviewModal').classList.remove('hidden'); }
        function closeImagePreview() { document.getElementById('imagePreviewModal').classList.add('hidden'); }
        function openDeleteModal(url) { document.getElementById('confirmDeleteBtn').href = url; document.getElementById('deleteModal').classList.remove('hidden'); }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); }
    </script>
</body>
</html>
